name: Kaggle Squares in Squares submission smoke test

on:
  push:
    branches: ["feature/kaggle-submission-pipeline"]
  pull_request:
    paths:
      - "gerit/kaggle.py"
      - "scripts/kaggle_submission.py"
      - "tests/test_kaggle_submission.py"
      - "data/**"
      - "requirements.txt"
      - ".github/workflows/kaggle.yml"

jobs:
  kaggle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install decimal interval validator
        run: python -m pip install "mpmath>=1.3,<2"
      - name: Run competition integration tests
        run: python -m unittest discover -s tests -p "test_kaggle_submission.py" -v
      - name: Export complete and partial CSVs and certify all 1000 puzzles
        run: python scripts/kaggle_submission.py --sources data --out kaggle_output --full-recheck
      - name: Upload reproducible competition outputs
        uses: actions/upload-artifact@v4
        with:
          name: gerit-kaggle-submission
          path: |
            kaggle_output/submission_complete.csv
            kaggle_output/submission_partial.csv
            kaggle_output/competition_report.csv
            kaggle_output/competition_report.json
          retention-days: 30
