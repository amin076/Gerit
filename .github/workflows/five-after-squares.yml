name: Gerit five-after-squares campaign tests

on:
  push:
    branches: ["feature/gerit-1000-integrated"]
    paths:
      - "scripts/run_five_after_squares.py"
      - "tests/test_five_after_squares.py"
      - ".github/workflows/five-after-squares.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Test 50-case selection and safe resume
        run: python -m unittest tests.test_five_after_squares -v
