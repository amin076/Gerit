name: Gerit historical-size fresh benchmark

on:
  push:
    paths:
      - ".github/workflows/historical-size-benchmark.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    strategy:
      fail-fast: false
      matrix:
        n: [5, 12, 17]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - name: Run existing evolutionary engine
        shell: bash
        run: |
          python scripts/run_fresh_25.py \
            --squares ${{ matrix.n }} --population 10 \
            --structural-seeds 3 --generations 12 \
            --offspring-per-parent 3 --seed 2715 \
            --output-dir results/github-n${{ matrix.n }}-smoke --no-zip
      - name: Validate complete candidate and calculate competition score
        shell: bash
        env:
          N: ${{ matrix.n }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          from gerit.kaggle import scan,validate,puzzle_score,baseline_score
          n=int(os.environ["N"])
          folder=Path(f"results/github-n{n}-smoke")
          candidates,audit=scan([folder/"selected_population_final.json",folder/"best_result.json"])
          if n not in candidates: raise ValueError("No validated candidate for N="+str(n))
          c=candidates[n]
          v=validate(c)
          result=dict(n=n,side=v.side,valid=v.valid,gerit_score=puzzle_score(n,v.side),
                      baseline_score=baseline_score(n),
                      delta_vs_grid=baseline_score(n)-puzzle_score(n,v.side),
                      source=c.source,seed=2715,generations=12,
                      new_independent_run=True)
          (folder/"kaggle_comparison.json").write_text(json.dumps(result,indent=2)+"\n")
          print(json.dumps(result,indent=2))
          PY
      - name: Save geometry and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gerit-n${{ matrix.n }}-fresh-smoke
          path: |
            results/github-n${{ matrix.n }}-smoke/run_summary.json
            results/github-n${{ matrix.n }}-smoke/best_result.json
            results/github-n${{ matrix.n }}-smoke/selected_population_final.json
            results/github-n${{ matrix.n }}-smoke/verification.json
            results/github-n${{ matrix.n }}-smoke/kaggle_comparison.json
          if-no-files-found: warn
          retention-days: 30
