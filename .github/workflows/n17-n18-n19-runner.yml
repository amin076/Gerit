name: N17 N18 N19 sequential runner smoke test

on:
  push:
    branches: [feature/five-square-corner-center]
    paths:
      - scripts/run_three_square_counts.py
      - .github/workflows/n17-n18-n19-runner.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        count: [17, 18, 19]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - name: Check Python CLI syntax
        run: python -m py_compile scripts/run_three_square_counts.py
      - name: Run real N-square generations
        run: |
          python -u scripts/run_three_square_counts.py \
            --counts ${{ matrix.count }} \
            --generations 2 --parents 4 --offspring-per-parent 1 \
            --report-every 1 --image-every 2 \
            --out-root results/three-count-smoke-${{ matrix.count }}
      - name: Validate report
        run: |
          python -c "import json,pathlib; n=${{ matrix.count }}; d=json.loads((pathlib.Path(f'results/three-count-smoke-{n}')/'sequential_summary.json').read_text()); assert d['status']=='completed' and len(d['completed'])==1; x=d['completed'][0]; assert x['n']==n and x['generations']==2 and x['validation'] in ('certified interval SAT','certified exact grid'); assert x['best_L']<=5.0+1e-10; print('PASS',n,x['best_L'])"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: three-count-smoke-${{ matrix.count }}
          path: results/three-count-smoke-*/
          if-no-files-found: warn
