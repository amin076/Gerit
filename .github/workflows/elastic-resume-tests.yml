name: Gerit N230 checkpoint resume tests

on:
  push:
    branches: ["feature/gerit-1000-integrated"]
    paths:
      - "scripts/run_elastic_resume.py"
      - "tests/test_elastic_resume.py"
      - ".github/workflows/elastic-resume-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resume-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Check deterministic checkpoint and safe dry-run
        run: python -m unittest tests.test_elastic_resume -v
