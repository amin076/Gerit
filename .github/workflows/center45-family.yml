name: Gerit all 15 center-45 solutions

on:
  push:
    branches: ["feature/gerit-1000-integrated"]
    paths:
      - "gerit/four_corner_center_45.py"
      - "scripts/run_center45_family.py"
      - "tests/test_center45_family.py"
      - ".github/workflows/center45-family.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  all-fifteen:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Validate geometry and runner
        run: python -m unittest tests.test_center45_family -v
      - name: Create isolated 1000-answer baseline
        run: python scripts/kaggle_best_registry.py --registry results/ci_center45_best_registry.json init
      - name: Validate and offer all 15 center45 solutions to temporary bank
        run: |
          python scripts/run_center45_family.py --registry results/ci_center45_best_registry.json --report results/ci_center45_report.json --apply
          python scripts/kaggle_best_registry.py --registry results/ci_center45_best_registry.json status
      - name: Preserve all 15 solutions and updated bank
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gerit-center45-family-15
          path: |
            results/ci_center45_report.json
            results/ci_center45_best_registry.json
          if-no-files-found: warn
          retention-days: 14
