name: Gerit elastic growth 226 to 227

on:
  push:
    branches: ["feature/gerit-1000-integrated"]
    paths:
      - "gerit/elastic_growth.py"
      - "scripts/run_elastic_growth.py"
      - "tests/test_elastic_growth.py"
      - ".github/workflows/elastic-growth-227.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  n227:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Gradient and safety regression tests
        run: python -m unittest tests.test_elastic_growth -v
      - name: Prepare isolated bank and restore preceding 30 winners
        run: |
          python scripts/kaggle_best_registry.py --registry results/ci_elastic_bank.json init
          python scripts/run_center45_family.py --registry results/ci_elastic_bank.json --report results/ci_elastic_center45.json --apply
          python scripts/run_l_frame_propagation.py --registry results/ci_elastic_bank.json --report results/ci_elastic_lframe.json --apply --ledger results/ci_elastic_lframe_ledger.jsonl --summary results/ci_elastic_lframe_summary.csv
      - name: Try 227 squares from validated 226 founder with all-square relaxation
        run: |
          python scripts/run_elastic_growth.py --registry results/ci_elastic_bank.json --first 227 --last 227 --attempts 16 --iterations 400 --seed 100 --apply --report results/ci_elastic_n227.json --ledger results/ci_elastic_ledger.jsonl --summary results/ci_elastic_summary.csv
          python scripts/kaggle_best_registry.py --registry results/ci_elastic_bank.json status
      - name: Independently re-export best bank into full Kaggle CSV
        run: |
          python scripts/export_registry_submission.py --registry results/ci_elastic_bank.json --output results/ci_elastic_submission.csv
      - name: Archive certified result, provenance and submission
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gerit-elastic-n227
          path: |
            results/ci_elastic_n227.json
            results/ci_elastic_ledger.jsonl
            results/ci_elastic_summary.csv
            results/ci_elastic_submission.csv
          if-no-files-found: warn
          retention-days: 21
