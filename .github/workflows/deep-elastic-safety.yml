name: Gerit deep elastic safety pilot

on:
  push:
    branches: ["feature/gerit-1000-integrated"]
    paths:
      - "scripts/run_deep_elastic.py"
      - "tests/test_deep_elastic.py"
      - ".github/workflows/deep-elastic-safety.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  safety:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Deep compression archive, progress and resume safety checks
        run: python -m unittest tests.test_deep_elastic -v
