name: Gerit downward propagation safety

on:
  push:
    branches: ["feature/gerit-1000-integrated"]
    paths:
      - "scripts/run_downward_propagation.py"
      - "tests/test_downward_propagation.py"
      - ".github/workflows/downward-propagation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Check certified deletion, immutable dry run, non-overwrite
        run: python -m unittest tests.test_downward_propagation -v
