name: Phase 1 geometry checks
on:
  push:
  pull_request:
jobs:
  geometry:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install visualization dependency
        run: python -m pip install Pillow
      - name: Run geometry and config tests
        run: python -m unittest discover -s tests -v
      - name: Validate five-square experiment config
        run: python -m gerit --config configs/five-squares.json --dry-run
