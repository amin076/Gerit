name: Gerit autonomous family sweep pilot

on:
  push:
    branches: ["feature/gerit-1000-integrated"]
    paths:
      - "gerit/packing_io.py"
      - "scripts/run_elastic_repair.py"
      - "scripts/run_deep_elastic.py"
      - "scripts/run_auto_family_sweep.py"
      - "tests/test_auto_family_sweep.py"
      - ".github/workflows/auto-family-sweep.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Check legacy JSON recovery and automatic sweep with small N
        run: python -m unittest tests.test_auto_family_sweep tests.test_n231_pipeline tests.test_deep_elastic -v
