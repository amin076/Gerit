name: Gerit symmetry preflight N17-N20

on:
  push:
    branches: ["feature/gerit-1000-integrated"]
    paths:
      - "scripts/audit_kaggle_symmetry.py"
      - "scripts/run_kaggle_advanced_batch.py"
      - "tests/test_kaggle_symmetry_preflight.py"
      - ".github/workflows/symmetry-preflight.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  symmetry:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Run symmetry regression tests
        run: python -m unittest tests.test_kaggle_symmetry_preflight -v
      - name: Initialize disposable 1000-answer bank
        run: python scripts/kaggle_best_registry.py --registry results/ci_symmetry_best_registry.json init
      - name: Evaluate all existing symmetry families for 17 18 19 20
        run: |
          python scripts/audit_kaggle_symmetry.py --counts 17 18 19 20 --seed 2715 --copies 3 --registry results/ci_symmetry_best_registry.json --output-dir results/ci_symmetry_audit --apply
          python scripts/kaggle_best_registry.py --registry results/ci_symmetry_best_registry.json status
      - name: Upload verified symmetry audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gerit-symmetry-audit-n17-n20
          path: |
            results/ci_symmetry_audit/
            results/ci_symmetry_best_registry.json
          if-no-files-found: warn
          retention-days: 14
