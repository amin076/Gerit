name: Gerit sweep promotion audit tests

on:
  push:
    branches: ["feature/gerit-1000-integrated"]
    paths:
      - "scripts/promote_auto_sweep.py"
      - "tests/test_promote_auto_sweep.py"
      - ".github/workflows/sweep-promotion-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Validate certified sweep promotion and no-registry mutation
        run: python -m unittest tests.test_promote_auto_sweep -v
