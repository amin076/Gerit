name: Gerit five-after-squares finalization tests

on:
  push:
    branches: ["feature/gerit-1000-integrated"]
    paths:
      - "scripts/finalize_five_after_squares.py"
      - "tests/test_finalize_five_after_squares.py"
      - ".github/workflows/finalize-five-after-squares.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Test multi-family preflight and read-only mode
        run: python -m unittest tests.test_finalize_five_after_squares -v
