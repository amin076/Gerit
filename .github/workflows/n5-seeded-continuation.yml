name: N5 500-best seeded continuation smoke test

on:
  push:
    branches: [feature/five-square-corner-center]
    paths:
      - scripts/run_five_square_evolution.py
      - experiments/five_squares/seed_from_local_500.json
      - tests/test_five_square_evolution.py
      - .github/workflows/n5-seeded-continuation.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  seeded-run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        generations: [10, 20]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - name: Verify seeded evolutionary integration
        run: python -m unittest discover -s tests -p test_five_square_evolution.py -v
      - name: Continue from exact user's 500-generation best
        run: |
          python -u scripts/run_five_square_evolution.py --initial-best-file experiments/five_squares/seed_from_local_500.json --generations ${{ matrix.generations }} --parents 20 --offspring-per-parent 5 --seed 2715 --exploration-side-cap 3.8 --historical-jump-every 20 --historical-stagnation-after 30 --report-every 10 --image-every 10 --out results/n5-seeded-${{ matrix.generations }}
      - name: Validate retained best and source
        run: |
          python -c "import json,pathlib; n=${{ matrix.generations }}; p=pathlib.Path('results')/f'n5-seeded-{n}'; d=json.loads((p/'kaggle_evolution_comparison.json').read_text()); assert d['generations']==n; assert d['initial_L']==2.7743606307960853; assert d['best_L']<=d['initial_L']+1e-10; assert d['interval_validation']=='certified interval SAT'; print('PASS: gen=',n,'initial=',d['initial_L'],'best=',d['best_L'])"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: n5-seeded-${{ matrix.generations }}
          path: results/n5-seeded-${{ matrix.generations }}/
          if-no-files-found: warn
